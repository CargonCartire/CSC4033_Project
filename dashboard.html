<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1 id="greeting">Loading…</h1>
    <p class="sub" id="email"></p>
    <p><strong id="points">–</strong> affinity points</p>
    <a href="/bulldog.html">
    <button type="button">Play Bulldog Game</button></a>
    <button id="logout">Log out</button>
  </main>

  <script>
    (async () => {
      const res = await fetch('/api/me');
      if (!res.ok) return (window.location.href = '/index.html');
      const user = await res.json();
      document.getElementById('greeting').textContent = `Hi, ${user.username}!`;
      document.getElementById('email').textContent = `Signed in as ${user.email}`;
      document.getElementById('points').textContent = user.affinityPoints;
    })();

    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
